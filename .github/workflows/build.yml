name: Build and Push

on:
  push:
    branches: [master]

jobs:
  docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout with LFS
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Get short SHA
        id: sha
        run: echo "short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          build-args: |
            LISTLESS_VERSION=${{ steps.sha.outputs.short }}
          push: true
          tags: |
            ghcr.io/just1ngray/listless:${{ github.sha }}
            ghcr.io/just1ngray/listless:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
